# Websites the scheduler and the GitHub Action check. Domains or URLs.
websites:
  - audiolibri.org
  - example.com
# Seconds each check may take before it counts as no verdict.
timeout: 30
# Where main.py writes the report; Docker overrides it with OUTPUT_FILE.
output_file: report.md
# Optional text placed above the results table.
report_template: report_template.md
