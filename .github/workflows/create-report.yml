name: Create report

# Runs every check against the websites in config.yaml and commits the
# result to report.md.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: create-report
  cancel-in-progress: false

jobs:
  create-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      # The runner image ships Chrome, ChromeDriver and Firefox, which the
      # browser_compatibility check uses. main.py exits non-zero when it
      # cannot write the report, and then nothing is committed.
      - name: Run the checks
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: python main.py

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.md
          if git diff --cached --quiet; then
            echo "report.md did not change"
          else
            git commit -m "chore(report): daily report"
            git push
          fi
