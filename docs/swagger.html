<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API reference - Website Monitor</title>
  <meta name="description" content="Reference of the Website Monitor REST API: endpoints to list the checks, run them against a website and read the results.">
  <link rel="canonical" href="https://fabriziosalmi.github.io/websites-monitor/swagger.html">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="preload" href="fonts/inter-5.3.0/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/swagger-ui-dist/swagger-ui.css?v=5.34.0">
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-display: swap;
      font-weight: 300 800;
      src: url('fonts/inter-5.3.0/inter-latin-wght-normal.woff2') format('woff2');
    }
    :root {
      color-scheme: light;
      --ds-ground: #F7F8FA;
      --ds-surface: #FFFFFF;
      --ds-border: #E4E7EC;
      --ds-text: #101828;
      --ds-muted: #475467;
      --ds-accent: #1D4ED8;
      --ds-accent-subtle: #EFF4FF;
      --ds-accent-border: #C7D7FE;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--ds-ground); color: var(--ds-text); font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .topbar-wm {
      position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 24px; background: var(--ds-surface); border-bottom: 1px solid var(--ds-border);
    }
    .topbar-wm img { width: 28px; height: 28px; border-radius: 7px; }
    .topbar-wm .title { font-weight: 600; font-size: 0.9375rem; }
    .topbar-wm .sub { color: var(--ds-muted); font-size: 0.8125rem; }
    .topbar-wm nav { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
    .topbar-wm nav a {
      display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px;
      border: 1px solid var(--ds-border); background: var(--ds-surface); color: var(--ds-text);
      font-size: 0.8125rem; font-weight: 600; text-decoration: none;
    }
    .topbar-wm nav a:hover { background: var(--ds-ground); }
    .notice-wm {
      max-width: 1460px; margin: 16px auto 0; padding: 12px 16px; border-radius: 12px; font-size: 0.8125rem; line-height: 1.5;
      background: var(--ds-accent-subtle); border: 1px solid var(--ds-accent-border); color: var(--ds-text);
    }
    .notice-wm code { font-size: 0.75rem; padding: 1px 5px; border-radius: 4px; background: var(--ds-surface); border: 1px solid var(--ds-border); }
    #swagger-ui { max-width: 1460px; margin: 0 auto; padding: 0 20px 40px; }
    .swagger-ui .topbar { display: none; }
    .swagger-ui, .swagger-ui .info .title, .swagger-ui .opblock-tag { font-family: inherit; }
    @media (max-width: 640px) { .topbar-wm { padding: 10px 16px; } .topbar-wm nav { margin-left: 0; } }
  </style>
</head>
<body>
  <header class="topbar-wm">
    <img src="favicon.svg?v=2" alt="" width="28" height="28">
    <div>
      <div class="title">Website Monitor</div>
      <div class="sub">API reference</div>
    </div>
    <nav aria-label="Links">
      <a href="./">Web UI</a>
      <a id="redoc-link" href="/api/redoc" hidden>ReDoc</a>
      <a href="openapi.json" id="spec-link">OpenAPI JSON</a>
      <a href="https://github.com/fabriziosalmi/websites-monitor" rel="noopener">GitHub</a>
    </nav>
  </header>
  <div id="snapshot-notice" class="notice-wm" hidden>
    This copy has no API behind it, so requests cannot be sent from here. Start the API
    (<code>docker compose up -d website-monitor-api</code>) and open <code>/api/docs</code> on it to try the endpoints.
  </div>
  <div id="swagger-ui"></div>

  <script src="vendor/swagger-ui-bundle.js?v=5.34.0"></script>
  <script src="vendor/swagger-ui-standalone-preset.js?v=5.34.0"></script>
  <script>
    /*
      Served by the API (under /docs/), the live description at
      /api/openapi.json is used and requests can be sent. Served as a static
      page (GitHub Pages), the snapshot docs/openapi.json is used, and
      "Try it out" is off because there is no API to answer.
    */
    (async function () {
      let url = 'openapi.json';
      let live = false;
      try {
        const res = await fetch('/api/openapi.json', { cache: 'no-store' });
        if (res.ok && (res.headers.get('content-type') || '').includes('json')) {
          url = '/api/openapi.json';
          live = true;
        }
      } catch (e) { /* no API on this origin */ }
      document.getElementById('spec-link').href = url;
      document.getElementById('redoc-link').hidden = !live;
      document.getElementById('snapshot-notice').hidden = live;
      SwaggerUIBundle({
        url,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'BaseLayout',
        validatorUrl: null,
        tagsSorter: 'alpha',
        displayRequestDuration: true,
        supportedSubmitMethods: live ? ['get', 'post'] : [],
      });
    })();
  </script>
</body>
</html>
