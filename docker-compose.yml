# Website Monitor - Docker Compose Configuration

services:
  # Main Website Monitor API Service
  website-monitor-api:
    build: .
    container_name: website-monitor-api
    ports:
      - "127.0.0.1:18000:8000"
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PAGESPEED_API_KEY=${PAGESPEED_API_KEY:-}
    command: ["python", "api.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - website-monitor-network

  # Scheduled Monitor Service (runs checks periodically)
  website-monitor-scheduler:
    build: .
    container_name: website-monitor-scheduler
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./README.md:/app/README.md
      - ./report_template.md:/app/report_template.md:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PAGESPEED_API_KEY=${PAGESPEED_API_KEY:-}
      - MONITOR_INTERVAL=${MONITOR_INTERVAL:-3600}  # Default: 1 hour
    command: ["python", "scheduler.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0)"]
      interval: 60s
      timeout: 5s
      retries: 3
    depends_on:
      - website-monitor-api
    networks:
      - website-monitor-network

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: website-monitor-nginx
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - website-monitor-api
    restart: unless-stopped
    profiles:
      - production

  # Optional: Redis for caching and task queues
  redis:
    image: redis:7-alpine
    container_name: website-monitor-redis
    ports:
      - "127.0.0.1:16379:6379"
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles:
      - production

  # Optional: PostgreSQL for storing monitoring results
  postgres:
    image: postgres:15-alpine
    container_name: website-monitor-db
    environment:
      POSTGRES_DB: website_monitor
      POSTGRES_USER: monitor_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
    ports:
      - "127.0.0.1:15432:5432"
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    profiles:
      - production

volumes:
  redis_data:
  postgres_data:

networks:
  website-monitor-network:
    driver: bridge
