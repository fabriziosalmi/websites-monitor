# Website Monitor: the API with the web UI, and a scheduler that runs every
# check against the websites in config.yaml and writes reports/report.md.

services:
  # REST API and web UI (http://<host>:<port>/)
  website-monitor-api:
    build: .
    container_name: website-monitor-api
    ports:
      - "${WM_BIND_ADDRESS:-127.0.0.1}:${WM_PORT:-8000}:8000"
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./docs:/app/docs:ro
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PAGESPEED_API_KEY=${PAGESPEED_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WAVE_API_KEY=${WAVE_API_KEY:-}
    command: ["python", "api.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - website-monitor-network

  # Runs main.py every MONITOR_INTERVAL seconds
  website-monitor-scheduler:
    build: .
    container_name: website-monitor-scheduler
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PAGESPEED_API_KEY=${PAGESPEED_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WAVE_API_KEY=${WAVE_API_KEY:-}
      - OUTPUT_FILE=reports/report.md
      - MONITOR_INTERVAL=${MONITOR_INTERVAL:-3600}
    command: ["python", "scheduler.py"]
    restart: unless-stopped
    # The image's HEALTHCHECK probes the API on port 8000, which this
    # container does not serve: without this line the scheduler is always
    # "unhealthy". If scheduler.py stops, the container stops and restarts.
    healthcheck:
      disable: true
    depends_on:
      - website-monitor-api
    networks:
      - website-monitor-network

networks:
  website-monitor-network:
    driver: bridge
